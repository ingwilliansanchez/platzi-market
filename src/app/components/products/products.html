<p> La cantidad de Productos en el carrito es: {{ myShoppingCart.length }} </p>
<p> El total de la compra es: {{ total }} USD </p>
<div class="products--grid">
    @for (product of products; track product.id) {
    <app-product [product]="product" (addedProduct)="onAddTotShoppingCart($event)"></app-product>
}
</div>
